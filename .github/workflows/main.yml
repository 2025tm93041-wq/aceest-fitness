name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Syntax check (compile)
        run: python -m compileall -q app.py tests
      - name: Lint with flake8
        run: flake8 .

  docker-build:
    name: Docker Image Assembly
    needs: build-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aceest-fitness:${{ github.sha }} .
      - name: Save image artifact
        run: docker save aceest-fitness:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  test:
    name: Automated Tests (in container)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load image
        run: docker load -i image.tar
      - name: Run Pytest inside the container
        run: |
          docker run --rm --user root \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/pytest.ini:/app/pytest.ini:ro" \
            aceest-fitness:${{ github.sha }} \
            sh -c "pip install --no-cache-dir pytest==8.3.3 && pytest -v"
